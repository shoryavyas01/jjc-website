<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | Jai Jwala Contracts</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to Jai Jwala Contracts homepage." />
  <link rel="icon" type="image/png" href="images/jjc-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .error-container {
      max-width: 600px;
    }
    .error-code {
      font-size: 120px;
      font-weight: 700;
      color: var(--blue);
      line-height: 1;
      margin-bottom: 20px;
    }
    .error-title {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--dark);
    }
    .error-message {
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 18px;
    }
    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 600;
      transition: 0.2s ease-in-out;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--blue);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(0,75,141,0.25);
    }
    .btn-secondary {
      background: #fff;
      color: var(--dark);
      border: 1px solid #e0e0e0;
    }
    .btn-secondary:hover {
      border-color: var(--blue);
      color: var(--blue);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary">Return Home</a>
      <a href="/services.html" class="btn btn-secondary">View Services</a>
    </div>
  </div>
</body>
</html>
